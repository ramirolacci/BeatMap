<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" filter="url(#glow)" />
  
  <!-- Inner Dark Vinyl Core -->
  <circle cx="32" cy="32" r="24" fill="#0d0d12" />
  
  <!-- Vinyl Grooves -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Center Hit Circle Badge -->
  <circle cx="32" cy="32" r="8" fill="url(#logoGrad)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>